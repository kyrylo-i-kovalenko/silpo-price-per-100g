name: Release

# Runs when a version tag such as v4.0.0 is pushed.
# Checks that the tag matches manifest.json, runs lint and tests,
# builds the zip and publishes it as a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Build zip
        run: scripts/package.sh

      - name: Write release notes
        run: |
          scripts/release-notes.sh "$VERSION" > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/silpo-price-calculator-${VERSION}.zip" \
            --title "v${VERSION}" \
            --notes-file notes.md
