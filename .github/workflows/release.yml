name: Release

# Runs when a version tag such as v4.0.0 is pushed, or when a release is
# published from the GitHub web page (Releases > Draft a new release).
# Checks that the tag matches manifest.json, runs lint and tests,
# builds the zip and attaches it to the GitHub release (creating the
# release if it does not exist yet).
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Build zip
        run: scripts/package.sh

      - name: Write release notes
        run: |
          scripts/release-notes.sh "$VERSION" > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/silpo-price-calculator-${VERSION}.zip"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
            body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
            if [ -z "$body" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$zip" \
              --title "v${VERSION}" \
              --notes-file notes.md
          fi
